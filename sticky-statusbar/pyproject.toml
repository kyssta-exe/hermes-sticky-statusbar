[project]
name = "sticky-statusbar"
version = "1.0.2"
description = "A self-updating Hermes status message that lives in your chat"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "kyssta" }]

# No runtime dependencies on purpose. Every platform SDK this plugin talks to
# (python-telegram-bot, discord.py, slack_bolt) is supplied by the platform
# plugin that is already installed in the profile, and each is imported lazily
# inside the sink that needs it — so `register()` succeeds on a host with no
# gateway platform installed.
dependencies = []
