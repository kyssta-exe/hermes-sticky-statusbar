[project]
name = "hermes-sticky-statusbar"
version = "1.0.0"
description = "A self-updating Hermes status message that lives in your chat"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "kyssta" }]
keywords = ["hermes", "hermes-agent", "plugin", "gateway", "telegram", "discord", "status"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# No runtime dependencies on purpose: every platform SDK is supplied by the
# platform plugin that is already installed, and each is imported lazily inside
# the sink that uses it, so register() works with no gateway platform at all.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pyyaml>=6,<7"]

[project.urls]
Homepage = "https://github.com/okyssta/hermes-sticky-statusbar"
Documentation = "https://hermes-agent.nousresearch.com/docs/developer-guide/plugins"
Issues = "https://github.com/okyssta/hermes-sticky-statusbar/issues"

# The installable plugin lives in ./sticky-statusbar — a flat directory plugin
# (plugin.yaml plus sibling modules), which is what `hermes plugins install`
# copies into ~/.hermes/plugins/. It carries its own pyproject.toml so PM can
# read its dependency declaration at admission time.
#
# It is deliberately a SUBDIRECTORY rather than flattened to the repo root: a
# flat layout puts __init__.py at the root, which makes pytest treat the whole
# repository as a package and fail to collect the tests with "attempted relative
# import with no known parent package". The nested form keeps both
# `hermes plugins install` and `pytest` happy.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
